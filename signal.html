<!DOCTYPE html>
<html>
<head>
<title>Traffic Signal with Moving Box</title>
<style>
.signal {
  width: 100px;
  background: black;
  padding: 15px;
  border-radius: 10px;
}
.light {
  width: 70px;
  height: 70px;
  background: gray;
  border-radius: 50%;
  margin: 10px auto;
  animation: light 6s infinite;
}
.red { animation-name: red; }
.yellow { animation-name: yellow; }
.green { animation-name: green; }

@keyframes red {
  0%,30% { background: red; }
  31%,100% { background: gray; }
}
@keyframes yellow {
  0%,30%,51%,100% { background: gray; }
  31%,50% { background: yellow; }
}
@keyframes green {
  0%,50% { background: gray; }
  51%,100% { background: green; }
}
.car {
  width: 100px;
  height: 50px;
  background: blue;
  margin-top: 30px;
  animation: move 6s infinite;
}
@keyframes move {
  0%,50% { transform: translateX(0); }
  100% { transform: translateX(500px); }
}
</style>
</head>
<body>
<h2>Traffic Signal Animation</h2>
<div class="signal">
  <div class="light red"></div>
  <div class="light yellow"></div>
  <div class="light green"></div>
</div>
<div class="car"></div>
</body>
</html>
